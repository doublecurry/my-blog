site_name: Jamz's Space
site_url: https://jamzspace.com/

copyright: 'Copyright &copy; 2026 <a href="https://jamzspace.com">jamz</a>. All rights reserved.'

extra:
  generator: false # 去掉默认的 MkDocs 生成器标签，保持页面简洁
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/doublecurry
      name: GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:jamz@linux.do
      name: Email
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/akajamZeng
      name: Twitter

theme:
  name: material
  custom_dir: overrides
  font: false # 关闭 Google Fonts 默认加载，由 extra.css 接管（霞鹜文楷 + EB Garamond）
  favicon: assets/favicon.svg
  palette:
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs # 开启顶部标签页横向导航
    - navigation.indexes # 将分组里的 index.md 作为章节首页，不在侧边栏重复显示
    - navigation.top # 开启右下角“返回顶部”按钮
    - content.code.copy # 为代码块添加复制按钮

extra_css:
  - stylesheets/extra.css

# 核心：多语言多目录配置
# 核心：多语言多目录配置（补充了新版强制要求的 default 标签）
plugins:
  - i18n:
      languages:
        - locale: en
          name: English
          default: true # 必须明确标记出谁是默认语言！
          build: true
        - locale: zh
          name: 简体中文
          default: false # 中文不是默认语言，设为 false
          build: true

# 导航结构（中英文共用一套框架，路径会自动根据语言映射）
nav:
  - Home:
      - index.md
      - Take Back Your Control: home/page1.md
      - From "Step-by-Step" to "Self-Reflection": home/page2.md
      - Building the Ultimate Workflow: home/page3.md
  # - articles:
  #     - Articles: articles/index.md
  #     - Tech: articles/tech.md
  #     - Life: articles/life.md
  - About: about.md
