site_name: Jamz's Space
site_url: https://jamzspace.com/
site_description: Personal notes on AI, developer workflows, automation, and independent thinking.
site_author: Jamz

copyright: 'Copyright &copy; 2025 - 2026 <a href="https://jamzspace.com">jamz</a>. All rights reserved.'

extra:
  generator: false # 去掉默认的 MkDocs 生成器标签，保持页面简洁
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/doublecurry
      name: GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:jamz@linux.do
      name: Email
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/akajamZeng
      name: Twitter

theme:
  name: material
  custom_dir: overrides
  font: false # 关闭 Google Fonts 默认加载，由 extra.css 接管（霞鹜文楷 + EB Garamond）
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs # 开启顶部标签页横向导航
    - navigation.indexes # 将分组里的 index.md 作为章节首页，不在侧边栏重复显示
    - navigation.top # 开启右下角“返回顶部”按钮
    - navigation.footer # 上一篇 / 下一篇文章导航
    - content.code.copy # 为代码块添加复制按钮
    - content.code.annotate # 支持代码注释标记

extra_css:
  - stylesheets/extra.css?v=20260520-2

plugins:
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          default: false
          build: true

# 导航结构（中英文共用一套框架，路径会自动根据语言映射）
nav:
  - Home: index.md
  - Essays:
      - essays/index.md
      - Efficiency Inflation: essays/efficiency-inflation.md
      - Agency in the AI Era: essays/agency-ai-era.md
      - Chain of Thought Evolution: essays/cot-evolution.md
  - Guides:
      - guides/index.md
      - Using Claude Code: guides/claude-code-use.md
      - Claude Code Skills: guides/claude-code-skills.md
      - Claude Code on Windows: guides/claude-code-windows.md
      - Pi Package Ecosystem: guides/pi-package-ecosystem.md
  - About: about.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
